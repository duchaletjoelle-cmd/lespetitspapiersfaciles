<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Messagerie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --vert: #1a6e3c;
      --vert-clair: #e8f5ee;
      --gris: #f0f0f0;
      --texte: #222;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gris);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--vert);
      color: white;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 600;
      flex-shrink: 0;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bulle {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 0.97rem;
      word-break: break-word;
    }
    .bulle.assistant {
      background: white;
      color: var(--texte);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .bulle.client {
      background: var(--vert);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .bulle.system {
      background: #fff3cd;
      color: #856404;
      align-self: center;
      font-size: 0.85rem;
      border-radius: 8px;
    }
    footer {
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 1rem;
      outline: none;
      resize: none;
      max-height: 120px;
      font-family: inherit;
    }
    #input:focus { border-color: var(--vert); }
    #btn-envoyer {
      background: var(--vert);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #btn-envoyer:disabled { opacity: 0.5; cursor: not-allowed; }
    .typing { color: #999; font-style: italic; font-size: 0.88rem; }
  </style>
</head>
<body>

<header id="titre">Chargement…</header>

<div id="chat"></div>

<footer>
  <textarea id="input" rows="1" placeholder="Votre message…" disabled></textarea>
  <button id="btn-envoyer" disabled>➤</button>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const btn = document.getElementById("btn-envoyer");
  const titre = document.getElementById("titre");

  let sessionId = null;
  let termine = false;

  function ajouterBulle(texte, qui) {
    const div = document.createElement("div");
    div.className = `bulle ${qui}`;
    div.textContent = texte;
    chat.appendChild(div);
    chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
    return div;
  }

  async function demarrer() {
    const rep = await fetch("/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: null, message: "__init__" }),
    });
    const data = await rep.json();
    sessionId = data.session_id;
    titre.textContent = "Messagerie";
    ajouterBulle(data.reponse, "assistant");
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }

  async function envoyer() {
    const texte = input.value.trim();
    if (!texte || termine) return;
    input.value = "";
    input.style.height = "auto";
    btn.disabled = true;
    input.disabled = true;

    ajouterBulle(texte, "client");
    const typing = ajouterBulle("…", "typing assistant");

    try {
      const rep = await fetch("/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: texte }),
      });
      const data = await rep.json();
      typing.remove();
      ajouterBulle(data.reponse, "assistant");

      if (data.termine) {
        termine = true;
        const msg = data.action === "complet"
          ? "Votre demande a bien été transmise. Merci !"
          : "Le professionnel vous contactera directement.";
        ajouterBulle(msg, "system");
      } else {
        input.disabled = false;
        btn.disabled = false;
        input.focus();
      }
    } catch (e) {
      typing.remove();
      ajouterBulle("Une erreur s'est produite. Veuillez réessayer.", "system");
      input.disabled = false;
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", envoyer);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  demarrer();
</script>
</body>
</html>
