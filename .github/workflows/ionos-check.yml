name: Diagnostic IONOS
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get install -y lftp
      - name: Lister dossiers IONOS
        env:
          IONOS_SFTP_SERVER: ${{ secrets.IONOS_SFTP_SERVER }}
          IONOS_SFTP_USERNAME: ${{ secrets.IONOS_SFTP_USERNAME }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          lftp -u "$IONOS_SFTP_USERNAME","$IONOS_SFTP_PASSWORD" "sftp://$IONOS_SFTP_SERVER:22" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 1
          set net:timeout 20
          echo "=== RACINE ==="
          ls /
          echo "=== /public ==="
          ls /public/
          bye
          EOF
